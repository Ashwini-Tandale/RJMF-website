<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Admin Login</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            primary: '#2563EB', // Blue-600
            secondary: '#1E40AF', // Blue-800S
          },
        },
      },
    }
  </script>
</head>
<body class="bg-gradient-to-br from-blue-100 via-white to-blue-200 min-h-screen flex items-center justify-center">

  <div class="bg-white p-8 rounded-2xl shadow-2xl w-[90%] max-w-sm transform transition-all duration-300 hover:scale-[1.02]">
    <div class="text-center mb-6">
      <img src="https://cdn-icons-png.flaticon.com/512/5087/5087579.png" alt="Admin" class="w-16 h-16 mx-auto mb-2">
      <h2 class="text-2xl font-bold text-gray-800">Admin Login</h2>
      <p class="text-gray-500 text-sm mt-1">Access your dashboard securely</p>
    </div>

    <form id="loginForm" class="space-y-4">
      <div>
        <label for="email" class="block text-gray-700 text-sm font-medium mb-1">Email</label>
        <input type="email" id="email" placeholder="Enter your email" 
          class="border border-gray-300 rounded-lg p-3 w-full focus:outline-none focus:ring-2 focus:ring-primary focus:border-transparent transition" required />
      </div>

      <div>
        <label for="password" class="block text-gray-700 text-sm font-medium mb-1">Password</label>
        <input type="password" id="password" placeholder="Enter your password" 
          class="border border-gray-300 rounded-lg p-3 w-full focus:outline-none focus:ring-2 focus:ring-primary focus:border-transparent transition" required />
      </div>

      <button type="submit" 
        class="bg-primary hover:bg-secondary text-white font-semibold py-2.5 px-4 rounded-lg w-full transition-all duration-300 shadow-md hover:shadow-lg">
        Login
      </button>

      <p id="error" class="text-red-500 text-center text-sm hidden mt-2">Invalid credentials</p>
    </form>

    <div class="text-center mt-6 text-sm text-gray-500">
      © 2025 RJMF Trust. All Rights Reserved.
    </div>
  </div>

  <script>
    document.getElementById('loginForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const email = document.getElementById('email').value;
      const password = document.getElementById('password').value;

      try {
        const res = await fetch('http://localhost:5000/api/admin/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email, password })
        });

        const data = await res.json();

        if (data.success) {
          window.location.href = 'dashboard.html';
        } else {
          document.getElementById('error').classList.remove('hidden');
        }
      } catch (error) {
        console.error('Error logging in:', error);
        alert('Network error. Please check the server connection.');
      }
    });
  </script>
</body>
</html>
